services:
  account:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      SITE_URL: https://account.xoranetwork.com
      NEXT_PUBLIC_NAKAMA_HOST: api.xoranetwork.com
      NEXT_PUBLIC_NAKAMA_PORT: "443"
      NEXT_PUBLIC_NAKAMA_SSL: "true"
      NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY}
      NAKAMA_HTTP_KEY: ${NAKAMA_HTTP_KEY:-}
      XORA_RECOVERY_SECRET: ${XORA_RECOVERY_SECRET}
      EMAIL_FROM: "${EMAIL_FROM:-XOrA Network <noreply@xoranetwork.com>}"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - avatar-data:/app/data/avatars

volumes:
  avatar-data:
